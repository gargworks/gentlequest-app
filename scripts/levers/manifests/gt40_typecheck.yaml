name: gt40_typecheck
description: Wrap `nucleus verify --tiers 0,1,2 --json` (import/type resolution chain) as a lever. Uses --json receipt — clean/found/skipped routed by structured fields, not stdout scraping.
enabled: true
triggers:
  - post_executor
inputs:
  nucleus_bin: nucleus
  timeout_seconds: 30
  tier: 2
outputs:
  ledger_event_type: lever.gt40_typecheck.observation
