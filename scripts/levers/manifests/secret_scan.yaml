name: secret_scan
description: Scan added diff lines for secret-key patterns (Google/Perplexity/Stripe/GitHub/AWS). Findings carry pattern prefix only, never the matched secret body.
enabled: true
triggers:
  - pre_commit
  - post_executor
inputs:
  diff_spec: HEAD~1..HEAD
  max_findings: 25
  patterns:
    - 'AIzaSy[A-Za-z0-9_-]{33}'
    - 'pplx-[A-Za-z0-9]{40,}'
    - 'sk_[a-f0-9]{40,}'
    - 'ghp_[A-Za-z0-9]{36}'
    - 'gho_[A-Za-z0-9]{36}'
    - 'AKIA[0-9A-Z]{16}'
outputs:
  ledger_event_type: lever.secret_scan.observation
