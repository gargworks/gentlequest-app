name: gt40_test_smoke
description: Wrap `nucleus verify --tiers 0,1,2,3 --json` (chain through test tier) as a lever. The historical --smoke flag is removed — nucleus argparse never accepted it.
enabled: true
triggers:
  - cron_15m
  - manual
inputs:
  nucleus_bin: nucleus
  timeout_seconds: 60
  tier: 3
outputs:
  ledger_event_type: lever.gt40_test_smoke.observation
