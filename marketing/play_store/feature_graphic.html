<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GentleQuest — Play Store feature graphic (1024×500)</title>
<style>
  :root {
    --gq-primary:        #667EEA;
    --gq-primary-light:  #EEF0FE;
    --gq-primary-mid:    #B5C2F3;
    --gq-primary-mid2:   #8FA1ED;
    --gq-primary-dk:     #4F63C9;
    --gq-ink:            #1F1B3A;
    --gq-bg-top:         #F8F7FF;
    --gq-bg-bot:         #EEF0FE;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--gq-bg-top); }

  .fg {
    width: 1024px; height: 500px;
    position: relative; overflow: hidden;
    background: linear-gradient(135deg,
      var(--gq-bg-top) 0%,
      var(--gq-bg-top) 45%,
      var(--gq-bg-bot) 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded',
                 'SF Pro Display', system-ui, sans-serif;
  }

  .ambient {
    position: absolute;
    right: -120px; top: 50%;
    transform: translateY(-50%);
    width: 720px; height: 720px;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle,
      rgba(102,126,234,0.30) 0%,
      rgba(102,126,234,0.13) 28%,
      rgba(102,126,234,0.05) 55%,
      transparent 72%);
    filter: blur(20px);
  }

  .copy {
    position: absolute;
    left: 72px; top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    max-width: 520px;
  }

  .wordmark {
    font-size: 64px;
    font-weight: 700;
    color: var(--gq-ink);
    letter-spacing: -1.2px;
    line-height: 1;
    margin: 0 0 24px 0;
  }

  .tagline {
    font-size: 28px;
    font-weight: 500;
    color: var(--gq-primary-dk);
    line-height: 1.25;
    letter-spacing: -0.4px;
    margin: 0 0 18px 0;
  }

  .sub {
    font-size: 18px;
    font-weight: 400;
    color: var(--gq-ink);
    opacity: 0.72;
    line-height: 1.45;
    margin: 0;
    max-width: 460px;
  }

  .breath {
    position: absolute;
    right: 100px; top: 50%;
    transform: translateY(-50%);
    width: 320px; height: 320px;
    z-index: 1;
  }
  .breath svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="fg">
  <div class="ambient"></div>

  <div class="breath" aria-hidden="true">
    <svg viewBox="0 0 200 200">
      <defs>
        <radialGradient id="orbCore" cx="42%" cy="38%" r="62%">
          <stop offset="0%"  stop-color="#667EEA"/>
          <stop offset="55%" stop-color="#4F63C9"/>
          <stop offset="100%" stop-color="#1F1B3A"/>
        </radialGradient>
      </defs>
      <circle cx="100" cy="100" r="90" fill="none" stroke="#B5C2F3" stroke-width="1.5" opacity="0.55"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="#8FA1ED" stroke-width="1.5" opacity="0.75"/>
      <circle cx="100" cy="100" r="50" fill="none" stroke="#4F63C9" stroke-width="1.5" opacity="0.95"/>
      <circle cx="100" cy="100" r="22" fill="url(#orbCore)"/>
    </svg>
  </div>

  <div class="copy">
    <h1 class="wordmark">GentleQuest</h1>
    <p class="tagline">Low-pressure mental check-ins.</p>
    <p class="sub">Mood, journal, and crisis support — quiet, private, on your phone.</p>
  </div>
</div>
</body>
</html>
