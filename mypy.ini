[mypy]
python_version = 3.9
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
no_implicit_optional = True
check_untyped_defs = False
disallow_untyped_defs = False
strict_optional = True
follow_imports = silent

# Start strict on newly-refactored modules, expand over time.
files =
    config/,
    setup/

exclude = (?x)(
    ^mcp-server-nucleus/
    | ^nucleus-mcp/
    | ^nucleus-nar/
    | ^mcp-get/
    | ^\.venv/
    | ^\.brain/
  )

# Config package: fully strict
[mypy-config.*]
disallow_untyped_defs = True
warn_unused_ignores = True

# Setup package: structural only (no strict defs yet)
[mypy-setup.*]
disallow_untyped_defs = False
warn_unused_ignores = False

# Flask attaches `limiter` dynamically — quiet that one
[mypy-flask_session]
ignore_missing_imports = True
