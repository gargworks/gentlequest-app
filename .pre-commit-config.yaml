default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(app\.py|config/|setup/|helpers/|routes/|tests/test_(helpers|config|setup)_.*\.py)$
      - id: ruff-format
        name: ruff (format)
        files: ^(app\.py|config/|setup/|helpers/|routes/|tests/test_(helpers|config|setup)_.*\.py)$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (config/ + setup/)
        files: ^(config/|setup/).*\.py$
        args: [--config-file=mypy.ini]
        additional_dependencies:
          - flask>=3.0
          - types-redis==4.6.0.20240903
          - types-requests==2.32.0.20240914

  - repo: local
    hooks:
      - id: pytest-helpers-fast
        name: pytest (helpers/config/setup fast subset)
        language: system
        entry: .venv/bin/python3 -m pytest tests/test_helpers_ tests/test_config_ tests/test_setup_ -q --tb=short --no-header
        pass_filenames: false
        files: ^(app\.py|config/|setup/|helpers/|tests/test_(helpers|config|setup)_.*\.py)$
