name: ai_buddy_web
description: "AI-powered mental health and academic assistant"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.5.2+26080402

environment:
  sdk: ">=3.3.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dio: ^5.4.1  # For API calls
  provider: ^6.1.2  # For state management
  shared_preferences: ^2.5.3  # For local storage
  intl: ^0.19.0  # For date formatting
  fl_chart: ^0.66.2  # For mood tracking charts
  url_launcher: ^6.2.5  # For opening crisis resource links
  flutter_markdown: ^0.6.20  # For rendering markdown in messages
  flutter_secure_storage: ^9.2.2  # For secure storage of session data (encryptedSharedPreferences on Android)
  animated_text_kit: ^4.2.2  # For typing animations
  cached_network_image: ^3.3.1  # For DhiWise image caching
  flutter_svg: ^2.0.10+1  # For DhiWise SVG support
  sentry_flutter: ^8.9.0  # Error tracking
  sentry: ^8.14.2  # Core Sentry SDK for web/mobile
  flutter_local_notifications: ^17.2.1  # Local OS notifications for iOS/Android
  timezone: ^0.9.3  # Timezone database for zoned scheduling

  # Connectivity — R1D12 Offline States: stream-based network change detection
  connectivity_plus: ^6.0.3

  # Firebase & Analytics
  firebase_core: ^3.8.1
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.2.1
  
  # App Rating & Reviews
  in_app_review: ^2.0.9
  
  # Version checking & updates
  upgrader: ^11.3.0
  
  # Deep linking
  app_links: ^6.3.2
  
  # Celebration animations
  confetti: ^0.7.0
  sse: ^4.1.5
  geolocator: 13.0.4
  geocoding: ^4.0.0

  http: any

  # Voice input (R1D7 Phase 1) — on-device speech-to-text.
  # iOS uses Apple Speech framework; Android uses Google SpeechRecognizer.
  # We pass onDevice: true to honor the "your voice stays on this device"
  # promise verbatim from the design HTML. Falls back to "type instead" on
  # devices/languages where on-device isn't supported.
  speech_to_text: ^7.0.0

  # Text-to-speech for the Profile "Voice notes" toggle (audit §7). Uses
  # platform TTS engines (AVSpeechSynthesizer on iOS, Android TextToSpeech).
  # No network round-trip; no audio leaves the device.
  flutter_tts: ^4.0.2

  # App version + build for honest Settings footer (was hardcoded
  # "Version 1.2.2 · build 26032321" until 2026-05-21).
  package_info_plus: ^8.0.0

  # Shareable mood card — capture widget as PNG + share to OS share sheet.
  share_plus: ^10.1.0
  path_provider: ^2.1.5
  screenshot: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  mockito: ^5.4.4
  build_runner: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/quests/
    - assets/images/dhiwise/
    - assets/icons/
    - assets/images/reference/
    - assets/legal/
    - assets/fonts/OFL.txt
    - assets/brand/icon_v1/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterRegular.ttf
        - asset: assets/fonts/InterMedium.ttf
          weight: 500
        - asset: assets/fonts/InterBold.ttf
          weight: 700
    # R1D14 Journal — variable fonts; Flutter resolves the weight axis at render time.
    # Fraunces = static reflective text (entry bodies, empty-state headline).
    # Caveat = encouraging prompts (chip starters, scribble accents).
    # Single .ttf per family — variable axes covered, smaller bundle than static instances.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces/Fraunces.ttf
        - asset: assets/fonts/Fraunces/Fraunces-Italic.ttf
          style: italic
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat/Caveat.ttf

# Launcher icons configuration
flutter_launcher_icons:
  android: true
  ios: false  # keep existing iOS icons; only regenerate Android
  # Base image used when a specific platform image is not provided
  image_path: assets/brand/icon_v1/gentlequest_ios_1024.png
  # Android adaptive layers
  adaptive_icon_foreground: assets/brand/icon_v1/gentlequest_android_1024.png
  adaptive_icon_background: assets/brand/icon_v1/gentlequest_android_bg_1024.png
  remove_alpha_ios: true
  min_sdk_android: 21
