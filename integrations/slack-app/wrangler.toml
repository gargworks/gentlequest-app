name = "eidetic-slack"
main = "worker.js"
compatibility_date = "2024-10-01"

# Workers KV namespace. Create with:
#   wrangler kv:namespace create EIDETIC_SLACK_KV
#   wrangler kv:namespace create EIDETIC_SLACK_KV --preview
# then paste the IDs below.
[[kv_namespaces]]
binding = "EIDETIC_SLACK_KV"
id = "377cc6e805ca46fea969fa036c20076f"
preview_id = "377cc6e805ca46fea969fa036c20076f"

# Secrets are NOT stored in this file. Set them with:
#   wrangler secret put SLACK_SIGNING_SECRET
#   wrangler secret put SLACK_CLIENT_ID
#   wrangler secret put SLACK_CLIENT_SECRET
#
# Custom domain (optional, recommended once you're past scaffold):
# [[routes]]
# pattern = "slack.eidetic.works/*"
# zone_name = "eidetic.works"
