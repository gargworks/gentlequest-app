<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Eidetic — Settings</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-soft: #141414;
      --bg-input: #1a1a1a;
      --fg: #e5e5e5;
      --muted: #888;
      --accent: #5eead4;
      --accent-dim: #2dd4bf;
      --border: #262626;
      --err: #f87171;
      --ok: #4ade80;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      min-height: 100vh;
    }
    .wrap {
      max-width: 560px; margin: 40px auto;
      padding: 24px; background: var(--bg-soft);
      border: 1px solid var(--border); border-radius: 6px;
    }
    h1 { color: var(--accent); margin: 0 0 4px; font-size: 18px; letter-spacing: 0.04em; }
    .sub { color: var(--muted); margin-bottom: 20px; font-size: 12px; }
    label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%; background: var(--bg-input); color: var(--fg);
      border: 1px solid var(--border); padding: 9px 10px;
      font-family: inherit; font-size: 13px; border-radius: 4px; outline: none;
    }
    input:focus { border-color: var(--accent-dim); }
    .field { margin-bottom: 16px; }
    .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 20px; }
    button {
      background: var(--bg); color: var(--accent);
      border: 1px solid var(--accent-dim); padding: 9px 14px;
      font-family: inherit; font-size: 12px; cursor: pointer;
      border-radius: 4px;
    }
    button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
    button:hover:not(:disabled) { background: rgba(94, 234, 212, 0.08); }
    button.primary:hover:not(:disabled) { background: var(--accent-dim); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .status { font-size: 12px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    code { background: var(--bg-input); padding: 1px 6px; border-radius: 3px; font-size: 11px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>EIDETIC</h1>
    <div class="sub">Bridge connection settings</div>

    <div class="field">
      <label for="bridgeUrl">Bridge URL</label>
      <input id="bridgeUrl" type="text" placeholder="http://127.0.0.1:8421">
      <div class="hint">Run <code>eideticd -bridge :8421</code> on this machine.</div>
    </div>

    <div class="field">
      <label for="token">Bearer token</label>
      <input id="token" type="password" placeholder="paste token here">
      <div class="hint">Copy from <code>~/.eidetic/bridge-token</code> after starting the daemon.</div>
    </div>

    <div class="row">
      <button id="saveBtn" class="primary">Save</button>
      <button id="testBtn">Test connection</button>
      <span id="status" class="status"></span>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
