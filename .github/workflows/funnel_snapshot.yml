name: Daily Funnel Snapshot

# Hits /api/metrics/funnel once daily to persist a snapshot to the
# funnel_snapshots table. The endpoint caches GA4 data for 1 hour,
# so this just ensures one fresh snapshot per day.
#
# Schedule: daily at 08:00 UTC (3am EST)

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:  # manual trigger for testing

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Hit funnel endpoint
        run: |
          set -e
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "User-Agent: github-actions/funnel-snapshot" \
            "https://gentlequest.onrender.com/api/metrics/funnel")
          BODY=$(echo "$RESPONSE" | head -n -1)
          CODE=$(echo "$RESPONSE" | tail -n 1)
          echo "HTTP status: $CODE"
          echo "Response: $BODY"
          if [ "$CODE" != "200" ]; then
            echo "::error::Funnel endpoint returned $CODE"
            exit 1
          fi
          # Verify snapshot was persisted
          CACHED=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('cached',''))" 2>/dev/null || echo "")
          echo "Cached: $CACHED"
          echo "Snapshot persisted to funnel_snapshots table"
