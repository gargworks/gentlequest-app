name: Semi-Annual Compliance Review

on:
  schedule:
    # July 1st at 9:00 AM UTC - Check for new state laws from spring sessions
    - cron: '0 9 1 7 *'
    # January 1st at 9:00 AM UTC - Check for laws from fall sessions
    - cron: '0 9 1 1 *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual review trigger'
        required: false
        default: 'Manual compliance review requested'

permissions:
  contents: read
  issues: write

jobs:
  create-review-issue:
    runs-on: ubuntu-latest
    
    steps:
      - name: Create Compliance Review Issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date();
            const reviewMonth = today.getMonth() === 0 ? 'January' : 'July';
            const reviewYear = today.getFullYear();
            
            // Check for Colorado AI Act deadline (June 30, 2026)
            const coloradoDeadline = new Date('2026-06-30');
            const coloradoAlert = today >= coloradoDeadline 
              ? '> [!CAUTION]\\n> Colorado AI Act is NOW IN EFFECT. Review if GentleQuest needs compliance action.\\n\\n'
              : '';
            
            // Check for EU AI Act deadline (August 2, 2026)
            const euDeadline = new Date('2026-08-02');
            const euAlert = today >= euDeadline 
              ? '> [!CAUTION]\\n> EU AI Act high-risk requirements are NOW IN EFFECT. Review market entry strategy.\\n\\n'
              : '';
            
            const issueBody = [
              '## Semi-Annual Compliance Review Checklist',
              '',
              'This is an automated reminder to review AI mental health regulations.',
              '',
              coloradoAlert + euAlert,
              '### 🇺🇸 US State Laws',
              '',
              '| State | Last Status | Check For | Source |',
              '|:---|:---|:---|:---|',
              '| Illinois | 🔴 Hard Ban | WOPR Act amendments | [ILGA](https://ilga.gov) |',
              '| Utah | 🟡 Temp Block | HB 452 amendments | [Utah Legislature](https://le.utah.gov) |',
              '| Washington | 🟡 Temp Block | MHMDA updates | [WA Legislature](https://leg.wa.gov) |',
              '| Colorado | ⏰ Pending (June 2026) | AI Act effective date | [CO Legislature](https://leg.colorado.gov) |',
              '| **All States** | — | NEW AI mental health bills | [NCSL](https://ncsl.org) |',
              '',
              '### 🌍 International',
              '',
              '| Region | Last Status | Check For | Source |',
              '|:---|:---|:---|:---|',
              '| EU | 🔵 Store Exclusion | AI Act implementation deadlines | [EU AI Act](https://artificialintelligenceact.eu) |',
              '| UK | 🟢 Allowed (18+) | Online Safety Act updates | [Ofcom](https://ofcom.org.uk) |',
              '| Australia | 🔵 Store Exclusion | TGA digital health guidance | [TGA](https://tga.gov.au) |',
              '',
              '### ✅ Action Items',
              '',
              '- [ ] Search NCSL for new AI mental health legislation',
              '- [ ] Review state legislature websites for bill amendments',
              '- [ ] Check international regulatory updates',
              '- [ ] Update `GEOFENCING_COMPLIANCE_MANUAL.md` if laws changed',
              '- [ ] Update `compliance_service.dart` blocklists if needed',
              '- [ ] Update App Store/Play Store distribution settings if needed',
              '- [ ] Run compliance tests: `flutter test test/services/compliance_service_test.dart`',
              '',
              '### 📚 Reference Documents',
              '',
              '- [Geofencing Compliance Manual](../blob/main/.gemini/antigravity/brain/GEOFENCING_COMPLIANCE_MANUAL.md)',
              '- [Compliance Service](../blob/main/ai_buddy_web/lib/services/compliance_service.dart)',
              '- [Compliance Tests](../blob/main/ai_buddy_web/test/services/compliance_service_test.dart)',
              '',
              '---',
              '',
              '*This issue was auto-generated by the Semi-Annual Compliance Review workflow.*',
              `*Triggered: ${context.eventName === 'workflow_dispatch' ? '${{ inputs.reason }}' : 'Scheduled review'}*`
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔔 [COMPLIANCE] ${reviewMonth} ${reviewYear} Legal Review`,
              body: issueBody,
              labels: ['compliance', 'legal', 'scheduled-review']
            });
            
            console.log('✅ Compliance review issue created');
