name: Weekly Funnel Report

# Generates a human-readable markdown report from the funnel_snapshots
# table and commits it to docs/ops/funnel_reports/ so you have a
# persistent history of the funnel over time.
#
# Schedule: every Monday at 09:00 UTC (5am EST)

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch history + latest snapshot
        id: fetch
        run: |
          set -e
          # Get the latest funnel snapshot
          LATEST=$(curl -s "https://gentlequest.onrender.com/api/metrics/funnel")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

          # Get last 30 snapshots for trend
          HISTORY=$(curl -s "https://gentlequest.onrender.com/api/metrics/funnel/history?limit=30")
          echo "history=$HISTORY" >> $GITHUB_OUTPUT

      - name: Generate report
        run: |
          set -e
          mkdir -p docs/ops/funnel_reports
          WEEK=$(date -u +%Y-W%V)
          DATE=$(date -u +%Y-%m-%d)
          FILE="docs/ops/funnel_reports/week_${WEEK}.md"

          LATEST='${{ steps.fetch.outputs.latest }}'
          HISTORY='${{ steps.fetch.outputs.history }}'

          python3 << PYEOF > "$FILE"
          import json, sys
          from datetime import datetime

          latest = json.loads('''$LATEST''')
          history = json.loads('''$HISTORY''')

          f = latest.get("funnel", {})
          all_time = latest.get("all_time", {})
          active = latest.get("active_users_90d", {})

          installs_90d = f.get("stage_2_installs", {})
          installs_all = all_time.get("installs", {})
          total_all = all_time.get("total_users", {})

          print(f"# Weekly Funnel Report — Week {WEEK}")
          print()
          print(f"**Generated:** {DATE}")
          print(f"**Source:** GA4 property 516568186 (simulator-filtered) + backend DB")
          print()
          print("## Current Funnel (last 90 days)")
          print()
          print("| Stage | Value |")
          print("|---|---|")
          print(f"| 1. Web visits | {f.get('stage_1_web_visits', 'null')} |")
          ios_90 = installs_90d.get('iOS', 0)
          and_90 = installs_90d.get('Android', 0)
          print(f"| 2. App installs | iOS: {ios_90}, Android: {and_90} (total: {ios_90 + and_90}) |")
          print(f"| 3. App opens | {f.get('stage_3_app_opens', 0)} |")
          print(f"| 4. First chat sent | {f.get('stage_4_first_chat', 0)} |")
          print()
          print("## All-Time (real devices only)")
          print()
          print("| Platform | Installs | Total Users |")
          print("|---|---|---|")
          for p in sorted(installs_all.keys()):
              print(f"| {p} | {installs_all.get(p, 0)} | {total_all.get(p, 0)} |")
          print()
          print("## Active Users (last 90 days)")
          print()
          print("| Platform | Active |")
          print("|---|---|")
          for p in sorted(active.keys()):
              print(f"| {p} | {active.get(p, 0)} |")
          print()
          print(f"## Snapshot History ({len(history.get('snapshots', []))} snapshots)")
          print()
          print("| Date | iOS installs (90d) | Android installs (90d) | App opens | First chat |")
          print("|---|---|---|---|---|")
          for s in reversed(history.get("snapshots", [])):
              d = s.get("data", {})
              inst = d.get("installs_90d", {})
              opens = d.get("app_opens_90d", 0)
              # first_chat not in snapshot data, only in live response
              ts = s.get("created_at", "")[:10]
              print(f"| {ts} | {inst.get('iOS', 0)} | {inst.get('Android', 0)} | {opens} | - |")
          print()
          print("---")
          print(f"*Auto-generated by GitHub Actions. Simulator traffic filtered (arm64, sdk_gphone, Android SDK). Test sessions excluded from stage 4.*")
          PYEOF

          echo "Report generated: $FILE"
          cat "$FILE"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ops/funnel_reports/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: weekly funnel report $(date -u +%Y-W%V)"
            git push
          fi
