name: iOS Release (IPA)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "iOS bundle identifier (e.g., app.mhb.preview)"
        required: false
        default: "app.mhb.preview"
      scheme:
        description: "Xcode scheme"
        required: false
        default: "Runner"
      export_method:
        description: "Export method (app-store, ad-hoc, development)"
        required: false
        default: "app-store"
      build_number:
        description: "Build number (optional). Defaults to GitHub run number if empty."
        required: false
        default: ""
      release_notes:
        description: "Release notes/changelog (optional)"
        required: false
        default: ""
      upload:
        description: "Upload to TestFlight after build?"
        required: false
        default: "false"
      preflight:
        description: "Run format/analyze/tests before build?"
        required: false
        default: "false"
      environment:
        description: "GitHub Environment to run upload job (e.g., beta, production)"
        required: false
        default: "beta"
      sentry_upload:
        description: "Upload dSYMs to Sentry?"
        required: false
        default: "false"
      sentry_org:
        description: "Sentry organization slug (if uploading dSYMs)"
        required: false
        default: ""
      sentry_project:
        description: "Sentry project slug (if uploading dSYMs)"
        required: false
        default: ""
      sentry_release:
        description: "Sentry release version (defaults to <bundle_id>@<build_number>)"
        required: false
        default: ""
      crashlytics_upload:
        description: "Upload dSYMs to Firebase Crashlytics?"
        required: false
        default: "false"
  workflow_call:
    inputs:
      bundle_id:
        required: false
        type: string
        default: "app.mhb.preview"
      scheme:
        required: false
        type: string
        default: "Runner"
      export_method:
        required: false
        type: string
        default: "app-store"
      build_number:
        required: false
        type: string
        default: ""
      release_notes:
        required: false
        type: string
        default: ""
      upload:
        required: false
        type: string
        default: "false"
      preflight:
        required: false
        type: string
        default: "false"
      environment:
        required: false
        type: string
        default: "beta"
      sentry_upload:
        required: false
        type: string
        default: "false"
      sentry_org:
        required: false
        type: string
        default: ""
      sentry_project:
        required: false
        type: string
        default: ""
      sentry_release:
        required: false
        type: string
        default: ""
      crashlytics_upload:
        required: false
        type: string
        default: "false"

jobs:
  build_ios:
    name: Build iOS (IPA or App)
    runs-on: macos-14
    env:
      # Flutter location
      FLUTTER_VERSION: '3.32.8'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter version
        run: flutter --version

      - name: Cache Pub (Dart/Flutter packages)
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('ai_buddy_web/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter deps
        working-directory: ai_buddy_web
        run: flutter pub get

      - name: Remove stale Podfile.lock to enforce pinned Firebase version
        working-directory: ai_buddy_web/ios
        run: rm -f Podfile.lock

      - name: Preflight - format check
        if: ${{ (inputs.preflight || github.event.inputs.preflight) == 'true' }}
        working-directory: ai_buddy_web
        run: |
          set -e
          # Format only relevant Dart sources; exclude backups/exports to keep CI stable
          FOUND=$(find . -type f -name "*.dart" \
            -not -path "./lib/screens/quest_screen_backup/*" \
            -not -path "./lib/screens/quest_screen/*" \
            -not -path "./lib/dhiwise_export/*" \
            -not -path "./lib/dhiwise/*" \
            -not -path "./lib/dhiwise/**/backup/*" -print)
          if [ -z "$FOUND" ]; then
            echo "No Dart files to format"; exit 0;
          fi
          printf "%s\n" "$FOUND" | tr '\n' '\0' | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Preflight - analyze
        if: ${{ (inputs.preflight || github.event.inputs.preflight) == 'true' }}
        working-directory: ai_buddy_web
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Preflight - tests
        if: ${{ (inputs.preflight || github.event.inputs.preflight) == 'true' }}
        working-directory: ai_buddy_web
        run: |
          if [ -d test ]; then
            flutter test -r expanded
          else
            echo "No tests/ directory found. Skipping flutter test."
          fi

      - name: Clear Pods and lockfile to enforce pinned Firebase version
        working-directory: ai_buddy_web/ios
        run: |
          rm -rf Pods Podfile.lock

      - name: Install CocoaPods
        working-directory: ai_buddy_web/ios
        env:
          FIREBASE_SDK_VERSION: "11.10.0"
        run: |
          set -e
          pod install --repo-update

      - name: Determine build number
        id: bn
        shell: bash
        env:
          BN_DISPATCH: ${{ github.event.inputs.build_number }}
          BN_CALL: ${{ inputs.build_number }}
        run: |
          BN="$BN_DISPATCH"; [ -z "$BN" ] && BN="$BN_CALL"; [ -z "$BN" ] && BN="$GITHUB_RUN_NUMBER"
          echo "bn=$BN" >> $GITHUB_OUTPUT

      - name: Prepare iOS signing (optional)
        id: signing
        shell: bash
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -e
          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_MOBILEPROVISION_BASE64" ]; then
            echo "with_signing=true" >> $GITHUB_OUTPUT
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PASSWORD=$(uuidgen)
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            echo "$IOS_P12_BASE64" | base64 -d > $RUNNER_TEMP/cert.p12
            security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
            security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security find-identity -p codesigning -v || true
            
            # Install provisioning profile (temporary location first)
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            PROFILE_TEMP=~/Library/MobileDevice/Provisioning\ Profiles/temp.mobileprovision
            echo "$IOS_MOBILEPROVISION_BASE64" | base64 -d > "$PROFILE_TEMP"
            
            # Extract team ID and provisioning profile UUID
            TEAM_ID=$(security cms -D -i "$PROFILE_TEMP" 2>/dev/null | plutil -extract TeamIdentifier.0 raw -o - -)
            PROFILE_UUID=$(security cms -D -i "$PROFILE_TEMP" 2>/dev/null | plutil -extract UUID raw -o - -)
            
            echo "Team ID: $TEAM_ID"
            echo "Profile UUID: $PROFILE_UUID"
            
            # Rename profile to its UUID (required by Xcode)
            mv "$PROFILE_TEMP" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
            PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
            
            # Configure Xcode project for manual signing
            # Get the signing identity from the keychain (Apple Distribution or iPhone Distribution)
            SIGNING_IDENTITY=$(security find-identity -p codesigning -v "$KEYCHAIN_PATH" | grep -E "(Apple Distribution|iPhone Distribution)" | head -1 | awk '{print $2}')
            CERT_NAME=$(security find-identity -p codesigning -v "$KEYCHAIN_PATH" | grep -E "(Apple Distribution|iPhone Distribution)" | head -1 | sed 's/.*"\(.*\)"/\1/')
            echo "Using signing identity: $SIGNING_IDENTITY"
            echo "Certificate name: $CERT_NAME"
            
            # Update Xcode project to use manual signing
            sed -i '' 's/DEVELOPMENT_TEAM = "$(DEVELOPMENT_TEAM)";/DEVELOPMENT_TEAM = "'$TEAM_ID'";\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "'$PROFILE_UUID'";/g' ai_buddy_web/ios/Runner.xcodeproj/project.pbxproj
            
            # Create ExportOptions.plist using plutil
            mkdir -p ai_buddy_web/ios/Flutter
            /usr/libexec/PlistBuddy -c "Add :method string app-store" ai_buddy_web/ios/Flutter/ExportOptions.plist
            /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ai_buddy_web/ios/Flutter/ExportOptions.plist
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ai_buddy_web/ios/Flutter/ExportOptions.plist
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:app.gentlequest.www string $PROFILE_UUID" ai_buddy_web/ios/Flutter/ExportOptions.plist
            /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" ai_buddy_web/ios/Flutter/ExportOptions.plist
            /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" ai_buddy_web/ios/Flutter/ExportOptions.plist
            /usr/libexec/PlistBuddy -c "Add :compileBitcode bool false" ai_buddy_web/ios/Flutter/ExportOptions.plist
          else
            echo "with_signing=false" >> $GITHUB_OUTPUT
          fi

      - name: Find dSYMs (if any)
        id: dsym
        shell: bash
        run: |
          set -e
          # Common Flutter/Xcode locations
          DSYM=$(find ai_buddy_web -type d -name "*.dSYM" -print -quit || true)
          if [ -n "$DSYM" ]; then echo "path=$DSYM" >> $GITHUB_OUTPUT; fi

      - name: Upload dSYMs to Sentry (optional)
        if: ${{ (inputs.sentry_upload || github.event.inputs.sentry_upload) == 'true' && steps.dsym.outputs.path != '' }}
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ inputs.sentry_org || github.event.inputs.sentry_org }}
          SENTRY_PROJECT: ${{ inputs.sentry_project || github.event.inputs.sentry_project }}
          BUNDLE_ID: ${{ inputs.bundle_id || github.event.inputs.bundle_id }}
          BN: ${{ steps.bn.outputs.bn }}
          SENTRY_RELEASE_INPUT: ${{ inputs.sentry_release || github.event.inputs.sentry_release }}
        run: |
          set -e
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::warning::Missing Sentry config; skipping dSYM upload"; exit 0; fi
          REL="$SENTRY_RELEASE_INPUT"; [ -z "$REL" ] && REL="${BUNDLE_ID}@${BN}"
          echo "Using Sentry release: $REL"
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli --auth-token "$SENTRY_AUTH_TOKEN" releases --org "$SENTRY_ORG" new "$REL" || true
          sentry-cli --auth-token "$SENTRY_AUTH_TOKEN" upload-dif --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" "${{ steps.dsym.outputs.path }}"

      - name: Upload dSYMs to Crashlytics (optional)
        if: ${{ (inputs.crashlytics_upload || github.event.inputs.crashlytics_upload) == 'true' && steps.dsym.outputs.path != '' }}
        shell: bash
        env:
          GOOGLE_SERVICES_INFO_PLIST: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST }}
        run: |
          set -e
          if [ -z "$GOOGLE_SERVICES_INFO_PLIST" ]; then echo "::warning::GOOGLE_SERVICES_INFO_PLIST not set; skipping"; exit 0; fi
          echo "$GOOGLE_SERVICES_INFO_PLIST" | base64 -d > GoogleService-Info.plist
          if [ ! -f "${{ steps.dsym.outputs.path }}/Contents/Resources/DWARF/Runner" ]; then
            echo "::warning::dSYM missing Runner binary; skipping Crashlytics upload"; exit 0; fi
          curl -sL https://firebase.tools | bash
          ./firebase-crashlytics-uploader -p "${PWD}" -gsp "GoogleService-Info.plist" -pdsym "${{ steps.dsym.outputs.path }}"

      - name: Flutter build IPA
        working-directory: ai_buddy_web
        env:
          BUNDLE_ID: ${{ inputs.bundle_id || github.event.inputs.bundle_id }}
          BN: ${{ steps.bn.outputs.bn }}
          EXPORT_METHOD: ${{ inputs.export_method || github.event.inputs.export_method }}
          CRASHLYTICS_UPLOAD: ${{ inputs.crashlytics_upload || github.event.inputs.crashlytics_upload }}
          WITH_SIGNING: ${{ steps.signing.outputs.with_signing }}
        run: |
          set -e
          BN="${{ steps.bn.outputs.bn }}"
          echo "Using build number: $BN"
          EXPORT_OPTS=""
          if [ -f "ios/Flutter/ExportOptions.plist" ]; then
            EXPORT_OPTS="--export-options-plist=ios/Flutter/ExportOptions.plist"
          fi
          # Build signed IPA if signing materials are available, otherwise build unsigned
          if [ "$WITH_SIGNING" == "true" ]; then
            echo "Building signed IPA..."
            flutter build ipa --release --build-number "$BN" $EXPORT_OPTS
          else
            echo "Building unsigned IPA..."
            flutter build ipa --release --no-codesign --build-number "$BN" $EXPORT_OPTS
          fi

      - name: Upload IPA artifact (if any)
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ai_buddy_web/build/ios/ipa/*.ipa
        continue-on-error: true

      - name: Upload unsigned app artifact (zipped)
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ai_buddy_web/build/ios/ipa/*.app
        continue-on-error: true

  upload_to_testflight:
    name: Upload to TestFlight
    if: ${{ (inputs.upload || github.event.inputs.upload) == 'true' }}
    needs: build_ios
    runs-on: macos-14
    environment: ${{ inputs.environment || github.event.inputs.environment }}
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: dist

      - name: Install Apple certificate
        run: |
          set -e
          echo "$IOS_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k ~/Library/Keychains/login.keychain-db -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" ~/Library/Keychains/login.keychain-db
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Install provisioning profile
        run: |
          set -e
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
        env:
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -e
          if [ ! -f dist/*.ipa ]; then echo "No IPA found; skipping upload"; exit 0; fi
          xcrun altool --upload-app -t ios -f dist/*.ipa --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
