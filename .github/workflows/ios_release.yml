name: iOS Release (IPA)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "iOS bundle identifier (e.g., app.mhb.preview)"
        required: false
        default: "app.mhb.preview"
      scheme:
        description: "Xcode scheme"
        required: false
        default: "Runner"
      export_method:
        description: "Export method (app-store, ad-hoc, development)"
        required: false
        default: "app-store"
      build_number:
        description: "Build number (optional). Defaults to GitHub run number if empty."
        required: false
        default: ""
      release_notes:
        description: "Release notes/changelog (optional)"
        required: false
        default: ""
      upload:
        description: "Upload to TestFlight after build?"
        required: false
        default: "false"
      preflight:
        description: "Run format/analyze/tests before build?"
        required: false
        default: "false"
      environment:
        description: "GitHub Environment to run upload job (e.g., beta, production)"
        required: false
        default: "beta"
      sentry_upload:
        description: "Upload dSYMs to Sentry?"
        required: false
        default: "false"
      sentry_org:
        description: "Sentry organization slug (if uploading dSYMs)"
        required: false
        default: ""
      sentry_project:
        description: "Sentry project slug (if uploading dSYMs)"
        required: false
        default: ""
      sentry_release:
        description: "Sentry release version (defaults to <bundle_id>@<build_number>)"
        required: false
        default: ""
      crashlytics_upload:
        description: "Upload dSYMs to Firebase Crashlytics?"
        required: false
        default: "false"
      submit_for_review:
        description: "After TestFlight upload, submit the build to App Store Review?"
        required: false
        default: "false"
      runner_type:
        description: "Where to run the build"
        required: false
        default: "github_hosted"
  workflow_call:
    inputs:
      bundle_id:
        required: false
        type: string
        default: "app.mhb.preview"
      scheme:
        required: false
        type: string
        default: "Runner"
      export_method:
        required: false
        type: string
        default: "app-store"
      build_number:
        required: false
        type: string
        default: ""
      release_notes:
        required: false
        type: string
        default: ""
      upload:
        required: false
        type: string
        default: "false"
      preflight:
        required: false
        type: string
        default: "false"
      environment:
        required: false
        type: string
        default: "beta"
      sentry_upload:
        required: false
        type: string
        default: "false"
      sentry_org:
        required: false
        type: string
        default: ""
      sentry_project:
        required: false
        type: string
        default: ""
      sentry_release:
        required: false
        type: string
        default: ""
      crashlytics_upload:
        required: false
        type: string
        default: "false"
      submit_for_review:
        required: false
        type: string
        default: "false"
      runner_type:
        required: false
        type: string
        default: "github_hosted"

jobs:
  build_ios:
    name: Build iOS (IPA or App)
    runs-on: ${{ (inputs.runner_type || github.event.inputs.runner_type) == 'self_hosted' && 'self-hosted' || 'macos-26' }}
    env:
      # Flutter location
      FLUTTER_VERSION: '3.32.8'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter version
        run: flutter --version

      - name: Cache Pub (Dart/Flutter packages)
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('ai_buddy_web/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter deps
        working-directory: ai_buddy_web
        run: flutter pub get

      - name: Remove stale Podfile.lock to enforce pinned Firebase version
        working-directory: ai_buddy_web/ios
        run: rm -f Podfile.lock

      - name: Preflight - format check
        if: ${{ (inputs.preflight || github.event.inputs.preflight) == 'true' }}
        working-directory: ai_buddy_web
        run: |
          set -e
          # Format only relevant Dart sources; exclude backups/exports to keep CI stable
          FOUND=$(find . -type f -name "*.dart" \
            -not -path "./lib/screens/quest_screen_backup/*" \
            -not -path "./lib/screens/quest_screen/*" \
            -not -path "./lib/dhiwise_export/*" \
            -not -path "./lib/dhiwise/*" \
            -not -path "./lib/dhiwise/**/backup/*" -print)
          if [ -z "$FOUND" ]; then
            echo "No Dart files to format"; exit 0;
          fi
          printf "%s\n" "$FOUND" | tr '\n' '\0' | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Preflight - analyze
        if: ${{ (inputs.preflight || github.event.inputs.preflight) == 'true' }}
        working-directory: ai_buddy_web
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Preflight - tests
        if: ${{ (inputs.preflight || github.event.inputs.preflight) == 'true' }}
        working-directory: ai_buddy_web
        run: |
          if [ -d test ]; then
            flutter test -r expanded
          else
            echo "No tests/ directory found. Skipping flutter test."
          fi

      - name: Clear Pods and lockfile to enforce pinned Firebase version
        working-directory: ai_buddy_web/ios
        run: |
          rm -rf Pods Podfile.lock

      - name: Install CocoaPods
        working-directory: ai_buddy_web/ios
        env:
          FIREBASE_SDK_VERSION: "11.10.0"
        run: |
          set -e
          pod install --repo-update

      - name: Determine build number
        id: bn
        shell: bash
        env:
          BN_DISPATCH: ${{ github.event.inputs.build_number }}
          BN_CALL: ${{ inputs.build_number }}
        run: |
          BN="$BN_DISPATCH"; [ -z "$BN" ] && BN="$BN_CALL"; [ -z "$BN" ] && BN="$GITHUB_RUN_NUMBER"
          echo "bn=$BN" >> $GITHUB_OUTPUT

      - name: Prepare iOS signing (optional)
        id: signing
        shell: bash
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -e
          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_MOBILEPROVISION_BASE64" ]; then
            echo "with_signing=true" >> $GITHUB_OUTPUT
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PASSWORD=$(uuidgen)
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            echo "$IOS_P12_BASE64" | base64 -d > $RUNNER_TEMP/cert.p12
            security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
            security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security find-identity -p codesigning -v || true
            
            # Install provisioning profile (temporary location first)
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            PROFILE_TEMP=~/Library/MobileDevice/Provisioning\ Profiles/temp.mobileprovision
            echo "$IOS_MOBILEPROVISION_BASE64" | base64 -d > "$PROFILE_TEMP"
            
            # Extract team ID and provisioning profile UUID
            TEAM_ID=$(security cms -D -i "$PROFILE_TEMP" 2>/dev/null | plutil -extract TeamIdentifier.0 raw -o - -)
            PROFILE_UUID=$(security cms -D -i "$PROFILE_TEMP" 2>/dev/null | plutil -extract UUID raw -o - -)
            
            echo "Team ID: $TEAM_ID"
            echo "Profile UUID: $PROFILE_UUID"
            
            # Rename profile to its UUID (required by Xcode)
            mv "$PROFILE_TEMP" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
            PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
            
            # Configure Xcode project for manual signing
            # Get the signing identity from the keychain (Apple Distribution or iPhone Distribution)
            SIGNING_IDENTITY=$(security find-identity -p codesigning -v "$KEYCHAIN_PATH" | grep -E "(Apple Distribution|iPhone Distribution)" | head -1 | awk '{print $2}')
            CERT_NAME=$(security find-identity -p codesigning -v "$KEYCHAIN_PATH" | grep -E "(Apple Distribution|iPhone Distribution)" | head -1 | sed 's/.*"\(.*\)"/\1/')
            echo "Using signing identity: $SIGNING_IDENTITY"
            echo "Certificate name: $CERT_NAME"
            
            # Update Xcode project to use manual signing
            sed -i '' 's/DEVELOPMENT_TEAM = "$(DEVELOPMENT_TEAM)";/DEVELOPMENT_TEAM = "'$TEAM_ID'";\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "'$PROFILE_UUID'";/g' ai_buddy_web/ios/Runner.xcodeproj/project.pbxproj
            
            # Create ExportOptions.plist using plutil
            mkdir -p ai_buddy_web/ios/Flutter
            /usr/libexec/PlistBuddy -c "Add :method string app-store" ai_buddy_web/ios/Flutter/ExportOptions.plist
            /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ai_buddy_web/ios/Flutter/ExportOptions.plist
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ai_buddy_web/ios/Flutter/ExportOptions.plist
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.gentlequest.app string $PROFILE_UUID" ai_buddy_web/ios/Flutter/ExportOptions.plist
            /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" ai_buddy_web/ios/Flutter/ExportOptions.plist
            /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" ai_buddy_web/ios/Flutter/ExportOptions.plist
            /usr/libexec/PlistBuddy -c "Add :compileBitcode bool false" ai_buddy_web/ios/Flutter/ExportOptions.plist
          else
            echo "with_signing=false" >> $GITHUB_OUTPUT
          fi

      - name: Find dSYMs (if any)
        id: dsym
        shell: bash
        run: |
          set -e
          # Common Flutter/Xcode locations
          DSYM=$(find ai_buddy_web -type d -name "*.dSYM" -print -quit || true)
          if [ -n "$DSYM" ]; then echo "path=$DSYM" >> $GITHUB_OUTPUT; fi

      - name: Upload dSYMs to Sentry (optional)
        if: ${{ (inputs.sentry_upload || github.event.inputs.sentry_upload) == 'true' && steps.dsym.outputs.path != '' }}
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ inputs.sentry_org || github.event.inputs.sentry_org }}
          SENTRY_PROJECT: ${{ inputs.sentry_project || github.event.inputs.sentry_project }}
          BUNDLE_ID: ${{ inputs.bundle_id || github.event.inputs.bundle_id }}
          BN: ${{ steps.bn.outputs.bn }}
          SENTRY_RELEASE_INPUT: ${{ inputs.sentry_release || github.event.inputs.sentry_release }}
        run: |
          set -e
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::warning::Missing Sentry config; skipping dSYM upload"; exit 0; fi
          REL="$SENTRY_RELEASE_INPUT"; [ -z "$REL" ] && REL="${BUNDLE_ID}@${BN}"
          echo "Using Sentry release: $REL"
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli --auth-token "$SENTRY_AUTH_TOKEN" releases --org "$SENTRY_ORG" new "$REL" || true
          sentry-cli --auth-token "$SENTRY_AUTH_TOKEN" upload-dif --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" "${{ steps.dsym.outputs.path }}"

      - name: Setup Firebase configuration
        shell: bash
        env:
          GOOGLE_SERVICES_INFO_PLIST: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST }}
        run: |
          set -e
          if [ -z "$GOOGLE_SERVICES_INFO_PLIST" ]; then echo "::warning::GOOGLE_SERVICES_INFO_PLIST not set; skipping"; exit 0; fi
          mkdir -p ai_buddy_web/ios/Runner
          echo "$GOOGLE_SERVICES_INFO_PLIST" | base64 -d > ai_buddy_web/ios/Runner/GoogleService-Info.plist
          ls -lh ai_buddy_web/ios/Runner/GoogleService-Info.plist

      - name: Upload dSYMs to Crashlytics (optional)
        if: ${{ (inputs.crashlytics_upload || github.event.inputs.crashlytics_upload) == 'true' && steps.dsym.outputs.path != '' }}
        shell: bash
        run: |
          set -e
          if [ ! -f "ai_buddy_web/ios/Runner/GoogleService-Info.plist" ]; then echo "::warning::GoogleService-Info.plist missing; skipping Crashlytics upload"; exit 0; fi
          curl -sL https://firebase.tools | bash
          ./firebase-crashlytics-uploader -p "${PWD}" -gsp "ai_buddy_web/ios/Runner/GoogleService-Info.plist" -pdsym "${{ steps.dsym.outputs.path }}"

      - name: Flutter build IPA
        working-directory: ai_buddy_web
        env:
          BUNDLE_ID: ${{ inputs.bundle_id || github.event.inputs.bundle_id }}
          BN: ${{ steps.bn.outputs.bn }}
          EXPORT_METHOD: ${{ inputs.export_method || github.event.inputs.export_method }}
          CRASHLYTICS_UPLOAD: ${{ inputs.crashlytics_upload || github.event.inputs.crashlytics_upload }}
          WITH_SIGNING: ${{ steps.signing.outputs.with_signing }}
        run: |
          set -e
          BN="${{ steps.bn.outputs.bn }}"
          echo "Using build number: $BN"
          EXPORT_OPTS=""
          if [ -f "ios/Flutter/ExportOptions.plist" ]; then
            EXPORT_OPTS="--export-options-plist=ios/Flutter/ExportOptions.plist"
          fi
          # Build signed IPA if signing materials are available, otherwise build unsigned
          if [ "$WITH_SIGNING" == "true" ]; then
            echo "Building signed IPA..."
            flutter build ipa --release --build-number "$BN" $EXPORT_OPTS \
              --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
              --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
              --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
              --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          else
            echo "Building unsigned IPA..."
            flutter build ipa --release --no-codesign --build-number "$BN" $EXPORT_OPTS \
              --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
              --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
              --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
              --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          fi

      - name: Upload IPA artifact (if any)
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ai_buddy_web/build/ios/ipa/*.ipa
        continue-on-error: true

      - name: Upload unsigned app artifact (zipped)
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ai_buddy_web/build/ios/ipa/*.app
        continue-on-error: true

  upload_to_testflight:
    name: Upload to TestFlight
    if: ${{ (inputs.upload || github.event.inputs.upload) == 'true' }}
    needs: build_ios
    runs-on: ${{ (inputs.runner_type || github.event.inputs.runner_type) == 'self_hosted' && 'self-hosted' || 'macos-26' }}
    environment: ${{ inputs.environment || github.event.inputs.environment }}
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: dist

      - name: Upload and Hardening
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          RELEASE_NOTES: ${{ inputs.release_notes || github.event.inputs.release_notes }}
          BUNDLE_ID: ${{ inputs.bundle_id || github.event.inputs.bundle_id }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review || github.event.inputs.submit_for_review }}
        run: |
          set -e
          if [ ! -f dist/*.ipa ]; then echo "No IPA found; skipping upload"; exit 0; fi
          
          # Pre-flight: Validate API Key Existence
          if [ -z "$APP_STORE_CONNECT_API_KEY" ] || [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_API_ISSUER_ID" ]; then
            echo "::error::App Store Connect API credentials missing. Check GitHub Secrets."
            exit 1
          fi

          # Create private_keys directory for altool
          mkdir -p ~/.appstoreconnect/private_keys
          echo -e "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          
          echo "🚀 Uploading to TestFlight..."
          xcrun altool --upload-app -t ios -f dist/*.ipa --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
          
          echo "✅ Upload successful. Setting metadata..."
          
          # Note: Full REST API automation for 'whatsNew' and 'Groups' requires JWT generation.
          # We'll use a small Ruby script to handle the JWT and API calls for "Full Use" of the keys.
          cat << 'EOF' > ios_metadata.rb
          require 'jwt'
          require 'net/http'
          require 'json'
          require 'time'

          # Load Env
          key_id = ENV['APP_STORE_CONNECT_API_KEY_ID']
          issuer_id = ENV['APP_STORE_CONNECT_API_ISSUER_ID']
          private_key = ENV['APP_STORE_CONNECT_API_KEY'].gsub("\\n", "\n")
          bundle_id = ENV['BUNDLE_ID']
          notes = ENV['RELEASE_NOTES'] || "Standard Production Sync"

          # 1. Generate JWT
          payload = {
            iss: issuer_id,
            exp: Time.now.to_i + 20 * 60,
            aud: 'appstoreconnect-v1'
          }
          header = { kid: key_id }
          token = JWT.encode(payload, OpenSSL::PKey::EC.new(private_key), 'ES256', header)

          def req(path, token, method = :get, body = nil)
            uri = URI("https://api.appstoreconnect.apple.com/v1/#{path}")
            http = Net::HTTP.new(uri.host, uri.port)
            http.use_ssl = true
            request = case method
                      when :get then Net::HTTP::Get.new(uri)
                      when :post then Net::HTTP::Post.new(uri)
                      when :patch then Net::HTTP::Patch.new(uri)
                      end
            request['Authorization'] = "Bearer #{token}"
            request['Content-Type'] = 'application/json'
            request.body = body.to_json if body
            response = http.request(request)
            JSON.parse(response.body) if response.body && !response.body.empty?
          end

          puts "🔍 Finding App ID for #{bundle_id}..."
          apps = req("apps?filter[bundleId]=#{bundle_id}", token)
          app = apps['data']&.first
          unless app
            puts "❌ App not found for bundle ID: #{bundle_id}"
            exit 0
          end
          app_id = app['id']

          puts "🔍 Finding latest build for App #{app_id}..."
          builds = req("builds?filter[app]=#{app_id}&sort=-uploadedDate&limit=1", token)
          build = builds['data']&.first
          unless build
            puts "⚠️ Build not yet indexed by Apple (Normal immediately after upload)."
            exit 0
          end
          build_id = build['id']

          # 2. Add to 'Internal' Group if it exists
          puts "🔍 Checking for 'Internal' beta group..."
          groups = req("betaGroups?filter[app]=#{app_id}&filter[name]=Internal", token)
          group = groups['data']&.first
          if group
            puts "📦 Adding build #{build_id} to group '#{group['attributes']['name']}'..."
            req("betaGroups/#{group['id']}/relationships/builds", token, :post, { data: [{ id: build_id, type: 'builds' }] })
          else
            puts "ℹ️ 'Internal' group not found. Skipping auto-distribution."
          end

          # 3. Update 'What\'s New'
          # This requires looking up betaBuildLocalizations linked to the build
          puts "📝 Updating Release Notes (What's New)..."
          locs = req("builds/#{build_id}/betaBuildLocalizations", token)
          if locs['data']&.any?
            loc_id = locs['data'].first['id']
            req("betaBuildLocalizations/#{loc_id}", token, :patch, {
              data: {
                id: loc_id,
                type: 'betaBuildLocalizations',
                attributes: { whatsNew: notes }
              }
            })
            puts "✅ Release notes updated."
          else
            puts "ℹ️ No localization found for build yet. Skipping notes."
          end

          # 4. (Optional) Submit to App Store Review
          submit_for_review = ENV['SUBMIT_FOR_REVIEW'] == 'true'
          unless submit_for_review
            puts "ℹ️ SUBMIT_FOR_REVIEW=false. TestFlight upload complete; App Store submission skipped."
            exit 0
          end

          # Resolve the user-facing version string (CFBundleShortVersionString, e.g. "1.3.0").
          # build['attributes']['version'] is the build NUMBER, not the version string.
          # ASC list responses don't populate relationship .data; fetch the related
          # preReleaseVersion resource directly via /builds/{id}/preReleaseVersion.
          prv_resp = req("builds/#{build_id}/preReleaseVersion", token)
          if prv_resp.nil? || prv_resp['data'].nil? || prv_resp['data']['attributes'].nil?
            puts "❌ Could not resolve preReleaseVersion for build #{build_id}. Aborting submission."
            puts "   prv_resp=#{prv_resp.inspect}"
            exit 1
          end
          version_string = prv_resp['data']['attributes']['version']
          puts ""
          puts "🚀 SUBMIT_FOR_REVIEW=true. Target version: #{version_string} (build #{build['attributes']['version']})"

          # 4a. (Defensive cleanup) Delete any malformed App Store Version whose versionString
          # equals a numeric build number (artifact of the 2026-06-02 cc_gq bug where we used
          # build.attributes.version instead of preReleaseVersion.attributes.version).
          stale_resp = req("apps/#{app_id}/appStoreVersions?limit=200", token)
          (stale_resp['data'] || []).each do |v|
            vs = v['attributes']['versionString']
            state = v['attributes']['appStoreState']
            next unless vs =~ /^\d+$/  # purely numeric => likely a build number leak
            next if %w[READY_FOR_SALE PENDING_DEVELOPER_RELEASE PENDING_APPLE_RELEASE WAITING_FOR_REVIEW IN_REVIEW].include?(state)
            puts "🧹 Deleting malformed App Store Version #{v['id']} (versionString=#{vs}, state=#{state})..."
            uri = URI("https://api.appstoreconnect.apple.com/v1/appStoreVersions/#{v['id']}")
            http = Net::HTTP.new(uri.host, uri.port); http.use_ssl = true
            del = Net::HTTP::Delete.new(uri); del['Authorization'] = "Bearer #{token}"
            http.request(del)
          end

          # 4b. Find or create the correct App Store Version
          asv_resp = req("apps/#{app_id}/appStoreVersions?filter[versionString]=#{version_string}&limit=200", token)
          asv = asv_resp['data']&.first

          if asv
            asv_id = asv['id']
            asv_state = asv['attributes']['appStoreState']
            puts "✓ Found App Store Version #{asv_id} (#{version_string}), state=#{asv_state}"
            if %w[WAITING_FOR_REVIEW IN_REVIEW].include?(asv_state)
              puts "ℹ️ Version already submitted for review. Nothing to do."
              exit 0
            end
            if %w[PENDING_DEVELOPER_RELEASE PENDING_APPLE_RELEASE READY_FOR_SALE].include?(asv_state)
              puts "ℹ️ Version already approved/live. Nothing to do."
              exit 0
            end
          else
            puts "🆕 Creating new App Store Version #{version_string}..."
            create_body = {
              data: {
                type: 'appStoreVersions',
                attributes: { platform: 'IOS', versionString: version_string },
                relationships: { app: { data: { type: 'apps', id: app_id } } }
              }
            }
            asv_resp = req("appStoreVersions", token, :post, create_body)
            if asv_resp['errors']
              first_err = asv_resp['errors'].first
              detail = first_err['detail'] || ''
              # Apple only allows ONE pre-submission App Store Version at a time.
              # If there's an existing version in PREPARE_FOR_SUBMISSION / DEVELOPER_REJECTED /
              # REJECTED state, RENAME it to our target version string instead of creating new.
              # This preserves all pre-filled metadata (description, screenshots, etc.).
              if detail.include?('cannot create a new version') || detail.include?('current state')
                puts "ℹ️ Pre-existing pre-submission version blocks creation. Searching for renameable version..."
                all_versions = req("apps/#{app_id}/appStoreVersions?limit=200", token)
                renameable_states = %w[PREPARE_FOR_SUBMISSION DEVELOPER_REJECTED REJECTED METADATA_REJECTED INVALID_BINARY]
                puts "[diag] all_versions raw response: #{all_versions.inspect[0, 800]}"
                rename_target = (all_versions['data'] || []).find { |v| renameable_states.include?(v['attributes']['appStoreState']) }
                if rename_target.nil?
                  puts "❌ Could not create new version AND no renameable version found in renameable_states:"
                  asv_resp['errors'].each { |e| puts "  - #{e['title']}: #{e['detail']}" }
                  puts "All current versions (#{(all_versions['data'] || []).length} total):"
                  (all_versions['data'] || []).each do |v|
                    puts "  - id=#{v['id']} versionString=#{v['attributes']['versionString']} state=#{v['attributes']['appStoreState']} platform=#{v['attributes']['platform']}"
                  end
                  exit 1
                end
                old_vs = rename_target['attributes']['versionString']
                old_state = rename_target['attributes']['appStoreState']
                puts "🔁 Renaming App Store Version #{rename_target['id']} (#{old_vs}, state=#{old_state}) → #{version_string}"
                rename_resp = req("appStoreVersions/#{rename_target['id']}", token, :patch, {
                  data: {
                    type: 'appStoreVersions',
                    id: rename_target['id'],
                    attributes: { versionString: version_string }
                  }
                })
                if rename_resp && rename_resp['errors']
                  puts "❌ Rename failed:"
                  rename_resp['errors'].each { |e| puts "  - #{e['title']}: #{e['detail']}" }
                  exit 1
                end
                asv_id = rename_target['id']
                puts "✓ Renamed in place (preserved metadata): #{asv_id}"
              else
                puts "❌ Failed to create App Store Version:"
                asv_resp['errors'].each { |e| puts "  - #{e['title']}: #{e['detail']}" }
                exit 1
              end
            else
              asv_id = asv_resp['data']['id']
              puts "✓ Created App Store Version #{asv_id}"
            end
          end

          # 4c. Link build to App Store Version
          puts "🔗 Linking build #{build_id} to App Store Version #{asv_id}..."
          link_resp = req("appStoreVersions/#{asv_id}/relationships/build", token, :patch, {
            data: { type: 'builds', id: build_id }
          })
          if link_resp && link_resp['errors']
            puts "❌ Failed to link build:"
            link_resp['errors'].each { |e| puts "  - #{e['title']}: #{e['detail']}" }
            exit 1
          end
          puts "✓ Build linked"

          # 4d. Submit via new reviewSubmissions API.
          # Legacy appStoreVersionSubmissions.CREATE was deprecated by Apple — current flow:
          #   POST /v1/reviewSubmissions       (create submission container)
          #   POST /v1/reviewSubmissionItems   (add app store version to submission)
          #   PATCH /v1/reviewSubmissions/{id} (set submitted: true → actually submits)
          puts "📤 Creating review submission (new reviewSubmissions API)..."
          rs_resp = req("reviewSubmissions", token, :post, {
            data: {
              type: 'reviewSubmissions',
              attributes: { platform: 'IOS' },
              relationships: { app: { data: { type: 'apps', id: app_id } } }
            }
          })
          if rs_resp && rs_resp['errors']
            puts "❌ Failed to create review submission:"
            rs_resp['errors'].each { |e| puts "  - #{e['title']}: #{e['detail']}" }
            exit 1
          end
          rs_id = rs_resp['data']['id']
          puts "✓ Review submission #{rs_id} created"

          puts "📎 Adding App Store Version #{asv_id} as submission item..."
          rsi_resp = req("reviewSubmissionItems", token, :post, {
            data: {
              type: 'reviewSubmissionItems',
              relationships: {
                reviewSubmission: { data: { type: 'reviewSubmissions', id: rs_id } },
                appStoreVersion: { data: { type: 'appStoreVersions', id: asv_id } }
              }
            }
          })
          if rsi_resp && rsi_resp['errors']
            puts "❌ Failed to add submission item:"
            rsi_resp['errors'].each { |e| puts "  - #{e['title']}: #{e['detail']}" }
            exit 1
          end
          puts "✓ Submission item added"

          puts "📤 Submitting (PATCH submitted=true)..."
          submit_resp = req("reviewSubmissions/#{rs_id}", token, :patch, {
            data: { type: 'reviewSubmissions', id: rs_id, attributes: { submitted: true } }
          })
          if submit_resp && submit_resp['errors']
            puts "❌ Submit failed:"
            submit_resp['errors'].each { |e| puts "  - #{e['title']}: #{e['detail']}" }
            puts ""
            puts "Common causes (fix in App Store Connect Web UI then re-fire workflow):"
            puts "  - Missing required metadata: description, keywords, screenshots, support URL, age rating"
            puts "  - App Privacy details not filled (Privacy Practices section)"
            puts "  - Export compliance not declared (ITSAppUsesNonExemptEncryption already in Info.plist)"
            exit 1
          end
          puts "✅ Submitted to App Store Review! Apple typically reviews in ~24-48 hours."
          puts "   Track: https://appstoreconnect.apple.com/apps/#{app_id}/distribution"
          EOF

          # Check if ruby-jwt is available, if not install it (macos-26 has gem)
          if ! gem list -i jwt > /dev/null 2>&1; then
            echo "Installing ruby-jwt..."
            sudo gem install jwt -n /usr/local/bin --no-document
          fi
          
          ruby ios_metadata.rb

