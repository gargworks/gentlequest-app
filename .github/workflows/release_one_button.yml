name: One-Button Release (Beta)

permissions:
  contents: write

concurrency:
  group: one-button-release-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes/changelog (optional)"
        required: false
        default: ""
      build_number:
        description: "Unified build number for both platforms (optional). Defaults to run number if empty."
        required: false
        default: ""
      android_params:
        description: "Android parameters JSON (app_id, package_name, track, upload, preflight, crashlytics_upload)"
        required: false
        default: |
          {"app_id":"app.gentlequest.www","package_name":"app.gentlequest.www","track":"internal","status":"draft","upload":"true","preflight":"false","crashlytics_upload":"false"}
      ios_params:
        description: "iOS parameters JSON (bundle_id, scheme, export_method, upload, preflight)"
        required: false
        default: |
          {"bundle_id":"com.gentlequest.app","scheme":"Runner","export_method":"app-store","upload":"true","preflight":"false"}
      sentry_params:
        description: "Sentry parameters JSON (upload, org, project_android, project_ios, release, environment)"
        required: false
        default: |
          {"upload":"false","org":"","project_android":"","project_ios":"","release":"","environment":"beta"}
      release_params:
        description: "Release/notification parameters JSON (create_gh_release, notify_slack, tag_prefix)"
        required: false
        default: |
          {"create_gh_release":"false","notify_slack":"false","tag_prefix":"mobile-v"}
      runner_type:
        description: "Where to run the build"
        type: choice
        required: true
        default: "github_hosted"
        options:
          - github_hosted
          - self_hosted

jobs:
  parse-inputs:
    name: Parse inputs
    runs-on: ${{ inputs.runner_type == 'self_hosted' && 'self-hosted' || 'ubuntu-latest' }}
    outputs:
      android: ${{ steps.jq.outputs.android }}
      ios: ${{ steps.jq.outputs.ios }}
      sentry: ${{ steps.jq.outputs.sentry }}
      release_meta: ${{ steps.jq.outputs.release_meta }}
    steps:
      - name: Parse JSON payloads
        id: jq
        run: |
          echo "android=$(echo '${{ inputs.android_params }}' | jq -c .)" >> $GITHUB_OUTPUT
          echo "ios=$(echo '${{ inputs.ios_params }}' | jq -c .)" >> $GITHUB_OUTPUT
          echo "sentry=$(echo '${{ inputs.sentry_params }}' | jq -c .)" >> $GITHUB_OUTPUT
          echo "release_meta=$(echo '${{ inputs.release_params }}' | jq -c .)" >> $GITHUB_OUTPUT

  android:
    name: Android job
    needs: parse-inputs
    uses: ./.github/workflows/android_release.yml
    secrets: inherit
    with:
      app_id: ${{ fromJson(needs.parse-inputs.outputs.android).app_id }}
      package_name: ${{ fromJson(needs.parse-inputs.outputs.android).package_name }}
      track: ${{ fromJson(needs.parse-inputs.outputs.android).track }}
      status: ${{ fromJson(needs.parse-inputs.outputs.android).status || 'draft' }}
      build_number: ${{ inputs.build_number }}
      release_notes: ${{ inputs.release_notes }}
      upload: ${{ fromJson(needs.parse-inputs.outputs.android).upload }}
      preflight: ${{ fromJson(needs.parse-inputs.outputs.android).preflight }}
      environment: ${{ fromJson(needs.parse-inputs.outputs.sentry).environment }}
      sentry_upload: ${{ fromJson(needs.parse-inputs.outputs.sentry).upload }}
      sentry_org: ${{ fromJson(needs.parse-inputs.outputs.sentry).org }}
      sentry_project: ${{ fromJson(needs.parse-inputs.outputs.sentry).project_android }}
      sentry_release: ${{ fromJson(needs.parse-inputs.outputs.sentry).release }}
      crashlytics_upload: ${{ fromJson(needs.parse-inputs.outputs.android).crashlytics_upload }}
      runner_type: ${{ inputs.runner_type }}

  ios:
    name: iOS job
    needs: parse-inputs
    uses: ./.github/workflows/ios_release.yml
    secrets: inherit
    with:
      bundle_id: ${{ fromJson(needs.parse-inputs.outputs.ios).bundle_id }}
      scheme: ${{ fromJson(needs.parse-inputs.outputs.ios).scheme }}
      export_method: ${{ fromJson(needs.parse-inputs.outputs.ios).export_method }}
      build_number: ${{ inputs.build_number }}
      release_notes: ${{ inputs.release_notes }}
      upload: ${{ fromJson(needs.parse-inputs.outputs.ios).upload }}
      preflight: ${{ fromJson(needs.parse-inputs.outputs.ios).preflight }}
      environment: ${{ fromJson(needs.parse-inputs.outputs.sentry).environment }}
      sentry_upload: ${{ fromJson(needs.parse-inputs.outputs.sentry).upload }}
      sentry_org: ${{ fromJson(needs.parse-inputs.outputs.sentry).org }}
      sentry_project: ${{ fromJson(needs.parse-inputs.outputs.sentry).project_ios }}
      sentry_release: ${{ fromJson(needs.parse-inputs.outputs.sentry).release }}
      crashlytics_upload: ${{ fromJson(needs.parse-inputs.outputs.ios).crashlytics_upload || 'false' }}
      submit_for_review: ${{ fromJson(needs.parse-inputs.outputs.ios).submit_for_review || 'false' }}
      runner_type: ${{ inputs.runner_type }}

  release_notify:
    name: Release and Notify
    runs-on: ${{ inputs.runner_type == 'self_hosted' && 'self-hosted' || 'ubuntu-latest' }}
    needs: [parse-inputs, android, ios]
    env:
      DO_GH_RELEASE: ${{ fromJson(needs.parse-inputs.outputs.release_meta).create_gh_release }}
      DO_SLACK_NOTIFY: ${{ fromJson(needs.parse-inputs.outputs.release_meta).notify_slack }}
      TAG_PREFIX: ${{ fromJson(needs.parse-inputs.outputs.release_meta).tag_prefix }}
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: dist
        continue-on-error: true

      - name: Download iOS IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: dist
        continue-on-error: true

      - name: Compose tag and body
        id: meta
        shell: bash
        env:
          BN: ${{ inputs.build_number }}
          RN: ${{ inputs.release_notes }}
        run: |
          set -e
          BNV="$BN"; [ -z "$BNV" ] && BNV="$GITHUB_RUN_NUMBER"
          TAG="${TAG_PREFIX}${BNV}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "$RN" > RELEASE_BODY.txt
          echo "body_path=$PWD/RELEASE_BODY.txt" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: ${{ env.DO_GH_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.meta.outputs.body_path }}
          files: |
            dist/*.aab
            dist/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Slack notify
        if: ${{ env.DO_SLACK_NOTIFY == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -e
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "::warning::SLACK_WEBHOOK_URL not set, skipping"; exit 0; fi
          ANDROID_PRESENT=$(ls dist/*.aab 2>/dev/null | wc -l | xargs)
          IOS_PRESENT=$(ls dist/*.ipa 2>/dev/null | wc -l | xargs)
          MSG="Mobile build completed. Android artifact: $ANDROID_PRESENT, iOS artifact: $IOS_PRESENT. Tag: ${{ steps.meta.outputs.tag }}"
          PAYLOAD=$(printf '{"text":"%s"}' "${MSG//"/\"}")
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
 
