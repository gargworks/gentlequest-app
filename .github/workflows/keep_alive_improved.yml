name: Keep GentleQuest Warm (Improved)

on:
  schedule:
    # Every 10 minutes - safer margin (Render sleeps at 15 min)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    
    steps:
      - name: Ping Application
        id: ping_app
        run: |
          echo "🏓 Pinging GentleQuest at $(date)"
          URL="https://gentlequest.onrender.com/api/ping"
          
          # Try ping endpoint (no jitter needed at 10 min interval)
          if curl -fsSI --max-time 10 -H "User-Agent: gentlequest-keepalive/2.0" "$URL"; then
            echo "✅ Ping successful"
            exit 0
          fi
          
          # Fallback to health endpoint
          echo "⚠️ Ping failed, trying health endpoint..."
          if curl -fsS --max-time 10 -H "User-Agent: gentlequest-keepalive/2.0" "https://gentlequest.onrender.com/api/health"; then
            echo "✅ Health check successful"
            exit 0
          fi
          
          # Both failed - this is a real problem
          echo "❌ Both ping and health failed!"
          exit 1
      
      - name: Report Failure
        if: failure()
        run: |
          echo "🚨 KEEP-ALIVE FAILED at $(date)"
          echo "The app might be down or experiencing issues"
          # Could add webhook notification here

  # Additional job that runs less frequently but does a full check
  deep_check:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Deep Health Check
        run: |
          echo "🔍 Running deep health check..."
          
          # Check response time
          START=$(date +%s)
          curl -fsS --max-time 30 "https://gentlequest.onrender.com/api/health" > /dev/null
          END=$(date +%s)
          DURATION=$((END - START))
          
          if [ $DURATION -gt 10 ]; then
            echo "⚠️ Slow response: ${DURATION}s (possible cold start)"
          else
            echo "✅ Fast response: ${DURATION}s"
          fi
          
          # Check enterprise status
          if curl -fsS --max-time 10 "https://gentlequest.onrender.com/api/enterprise/status" | grep -q "active"; then
            echo "✅ Enterprise features active"
          else
            echo "⚠️ Enterprise features issue"
          fi
