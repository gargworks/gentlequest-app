# Prometheus config for Nucleus Anonymous Telemetry
# Scrapes metrics from the OTel Collector's Prometheus exporter
# Phase B: See PHASE_B_OBSERVABILITY_PROPOSAL.md

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "nucleus-otel-collector"
    static_configs:
      - targets: ["nucleus-otel-collector:8889"]
        labels:
          service: "nucleus-collector"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
