version: "3.8"

services:
  nucleus-sovereign:
    build:
      context: .
      dockerfile: deploy/Dockerfile.unified
    ports:
      - "3000:3000" # Map host 3000 to container HUD (listening on $PORT)
    environment:
      - PORT=3000
      # HUD_USER / HUD_PASS: no hardcoded default — middleware.ts fails
      # closed (503) if unset. Set real values via shell env or a local
      # .env file (never commit real values here).
      - HUD_USER=${HUD_USER:?set HUD_USER before starting the HUD service}
      - HUD_PASS=${HUD_PASS:?set HUD_PASS before starting the HUD service}
      - FORCE_VERTEX=1 # Optional: Enable Real Oracle locally if credentials mounting works
      # - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-creds.json
    volumes:
      - ./.brain:/app/.brain # Local Persistence (The Immortal Kernel)
      # - ./gcp-creds.json:/app/gcp-creds.json:ro # Optional: Mount GCP creds
    restart: unless-stopped
    # Healthcheck to ensure Supervisor started (HUD on 3000)
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/status" ]
      interval: 10s
      timeout: 5s
      retries: 5
