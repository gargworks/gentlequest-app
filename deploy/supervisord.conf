[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:nucleus]
command=python -m mcp_server_nucleus
directory=/app
environment=PORT=8000,NUCLEAR_BRAIN_PATH="/app/.brain",PYTHONPATH="/app/mcp-server-nucleus/src"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true

[program:hud]
command=/bin/bash -c "npm start -- -p ${PORT:-8080} -H 0.0.0.0"
directory=/app/tools/nucleus-hud
environment=
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
