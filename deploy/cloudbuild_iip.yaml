steps:
  # ==========================================
  # 1. BACKEND: Build, Push, Deploy
  # ==========================================
  
  # Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/iip-backend', 'backend']

  # Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/iip-backend']

  # Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'iip-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/iip-backend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--add-cloudsql-instances'
      - 'gen-lang-client-0894185576:us-central1:gentlequest-db'
      - '--set-env-vars'
      - 'DATABASE_URL=postgresql://gentlequest:gentlequest2026@/gentlequest?host=/cloudsql/gen-lang-client-0894185576:us-central1:gentlequest-db,GEMINI_API_KEY=${_GEMINI_API_KEY}'

  # ==========================================
  # 2. INTERMEDIATE: Capture Backend URL
  # ==========================================
  
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Fetching Backend URL..."
        gcloud run services describe iip-backend --platform managed --region us-central1 --format 'value(status.url)' > /workspace/backend_url.txt
        echo "Backend URL: $(cat /workspace/backend_url.txt)"

  # ==========================================
  # 3. FRONTEND: Build (with URL), Push, Deploy
  # ==========================================

  # Build Frontend Image (Injecting API_URL)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        export BACKEND_URL=$$(cat /workspace/backend_url.txt)
        echo "Building Frontend with API_URL=$${BACKEND_URL}/api/v1"
        docker build --build-arg API_URL="$${BACKEND_URL}/api/v1" -t gcr.io/$PROJECT_ID/iip-frontend flutter_app

  # Push Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/iip-frontend']

  # Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'iip-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/iip-frontend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/iip-backend'
  - 'gcr.io/$PROJECT_ID/iip-frontend'
